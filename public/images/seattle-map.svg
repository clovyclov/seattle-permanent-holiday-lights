<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="auto">
  <defs>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Landmass Background (Pale warm map terrain) -->
  <rect width="700" height="400" fill="#f1f5f9" />
  
  <!-- Puget Sound Water Body (Left Side) -->
  <path d="M 0,0 L 220,0 Q 240,60 190,120 Q 150,170 170,220 Q 200,280 130,340 L 160,400 L 0,400 Z" fill="url(#water)" opacity="0.8" />
  <!-- Lake Washington -->
  <path d="M 280,140 Q 310,190 300,250 Q 280,310 310,340 Q 325,320 320,240 Q 330,170 295,140 Z" fill="url(#water)" opacity="0.8" />
  <!-- Lake Sammamish -->
  <path d="M 370,210 Q 385,250 380,290 Q 395,290 390,240 Q 380,210 370,210 Z" fill="url(#water)" opacity="0.7" />

  <!-- Major Highway Lines (Interstate 5, 405, 520, 90) -->
  <!-- I-5 North-South -->
  <path d="M 230,0 L 245,90 L 235,170 L 240,240 L 220,320 L 210,400" fill="none" stroke="#f59e0b" stroke-width="4.5" opacity="0.75" />
  <!-- I-405 Eastside Bypass -->
  <path d="M 245,90 Q 345,150 340,240 Q 335,320 220,360" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.75" />
  <!-- Highway 520 Bridge -->
  <line x1="240" y1="210" x2="340" y2="205" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,2" />
  <!-- I-90 Bridge -->
  <line x1="238" y1="260" x2="340" y2="265" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,2" />

  <!-- Arterial roads grid -->
  <line x1="160" y1="60" x2="600" y2="60" stroke="#e2e8f0" stroke-width="2" />
  <line x1="170" y1="120" x2="650" y2="120" stroke="#e2e8f0" stroke-width="2" />
  <line x1="180" y1="170" x2="650" y2="170" stroke="#e2e8f0" stroke-width="2" />
  <line x1="180" y1="310" x2="650" y2="310" stroke="#e2e8f0" stroke-width="2" />

  <!-- City Labels & Red Map Pins -->

  <!-- Macro Pin Helper Macro: red pin with white dot and text label -->
  <!-- Marysville / Arlington (North) -->
  <g filter="url(#pin-shadow)" transform="translate(240, 45)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Marysville / Arlington</text>
  </g>

  <!-- Everett -->
  <g filter="url(#pin-shadow)" transform="translate(235, 95)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Everett</text>
  </g>

  <!-- Mill Creek -->
  <g filter="url(#pin-shadow)" transform="translate(270, 125)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#b91c1c">Mill Creek</text>
  </g>

  <!-- Lynnwood / Edmonds -->
  <g filter="url(#pin-shadow)" transform="translate(215, 140)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="-125" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Edmonds / Lynnwood</text>
  </g>

  <!-- Bothell / Woodinville -->
  <g filter="url(#pin-shadow)" transform="translate(305, 165)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Bothell &amp; Woodinville</text>
  </g>

  <!-- Kirkland -->
  <g filter="url(#pin-shadow)" transform="translate(325, 205)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Kirkland</text>
  </g>

  <!-- Seattle (Downtown & Ballard) -->
  <g filter="url(#pin-shadow)" transform="translate(230, 235)">
    <path d="M 0,-22 C -9,-22 -14,-14 -14,-8 C -14,6 0,18 0,18 C 0,18 14,6 14,-8 C 14,-14 9,-22 0,-22 Z" fill="#dc2626" />
    <circle cx="0" cy="-9" r="5" fill="#ffffff" />
    <text x="-70" y="-7" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#b91c1c">SEATTLE</text>
  </g>

  <!-- Bellevue / Redmond -->
  <g filter="url(#pin-shadow)" transform="translate(350, 245)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Bellevue &amp; Redmond</text>
  </g>

  <!-- Renton / South King County -->
  <g filter="url(#pin-shadow)" transform="translate(280, 335)">
    <path d="M 0,-18 C -7,-18 -11,-12 -11,-6 C -11,4 0,14 0,14 C 0,14 11,4 11,-6 C 11,-12 7,-18 0,-18 Z" fill="#dc2626" />
    <circle cx="0" cy="-7" r="4" fill="#ffffff" />
    <text x="16" y="-3" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a">Renton &amp; South King</text>
  </g>
</svg>
