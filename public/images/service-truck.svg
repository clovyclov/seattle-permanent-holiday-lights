<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="100%" height="auto">
  <defs>
    <filter id="truck-shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-opacity="0.25" />
    </filter>
    <linearGradient id="truck-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <g filter="url(#truck-shadow)">
    <!-- Ladder rack on roof -->
    <rect x="180" y="32" width="220" height="8" rx="2" fill="#94a3b8" />
    <line x1="200" y1="40" x2="200" y2="55" stroke="#64748b" stroke-width="6" />
    <line x1="300" y1="40" x2="300" y2="55" stroke="#64748b" stroke-width="6" />
    <line x1="380" y1="40" x2="380" y2="55" stroke="#64748b" stroke-width="6" />

    <!-- Yellow Extension Ladder on top -->
    <rect x="160" y="24" width="260" height="9" rx="2" fill="#eab308" />
    <line x1="170" y1="28.5" x2="410" y2="28.5" stroke="#ca8a04" stroke-width="2" />
    <line x1="180" y1="24" x2="180" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="195" y1="24" x2="195" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="210" y1="24" x2="210" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="225" y1="24" x2="225" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="240" y1="24" x2="240" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="255" y1="24" x2="255" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="270" y1="24" x2="270" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="285" y1="24" x2="285" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="300" y1="24" x2="300" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="315" y1="24" x2="315" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="330" y1="24" x2="330" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="345" y1="24" x2="345" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="360" y1="24" x2="360" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="375" y1="24" x2="375" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="390" y1="24" x2="390" y2="33" stroke="#854d0e" stroke-width="2" />
    <line x1="405" y1="24" x2="405" y2="33" stroke="#854d0e" stroke-width="2" />

    <!-- Van Body White Upper -->
    <path d="M 60,140 L 75,90 Q 90,65 130,60 L 390,55 Q 410,55 425,75 L 440,140 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Van Hood & Cab Front (facing left) -->
    <path d="M 60,140 L 30,148 Q 15,155 15,175 L 15,190 L 445,190 L 440,140 Z" fill="url(#truck-red)" />
    
    <!-- Red Swoop Graphics on Van Side -->
    <path d="M 60,140 Q 180,110 320,135 L 440,140 L 445,185 L 140,185 Z" fill="url(#truck-red)" />
    <path d="M 120,130 Q 220,105 340,128 L 335,138 Q 215,115 115,140 Z" fill="#f87171" opacity="0.6" />

    <!-- Cab Windshield & Windows -->
    <path d="M 80,95 L 65,135 L 135,135 L 135,90 Q 100,85 80,95 Z" fill="url(#glass)" />
    <rect x="145" y="88" width="60" height="47" rx="3" fill="url(#glass)" />
    
    <!-- White Lettering on Red Van Side -->
    <text x="180" y="166" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="0.5">
      SEATTLE PERMANENT LIGHTS
    </text>
    <text x="210" y="180" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="11" fill="#fef08a">
      (425) 330-6240
    </text>

    <!-- Side Mirrors -->
    <path d="M 60,115 L 48,118 L 48,132 L 60,130 Z" fill="#334155" />
    <!-- Headlight -->
    <path d="M 15,160 L 28,155 L 28,172 L 15,170 Z" fill="#fef08a" />
    <path d="M 15,172 L 28,173 L 28,180 L 15,178 Z" fill="#f97316" />

    <!-- Bumpers -->
    <rect x="10" y="180" width="22" height="15" rx="3" fill="#1e293b" />
    <rect x="435" y="180" width="18" height="15" rx="3" fill="#1e293b" />

    <!-- Wheel Wells & Wheels -->
    <!-- Front Wheel (Left) -->
    <circle cx="95" cy="190" r="32" fill="#0f172a" />
    <circle cx="95" cy="190" r="28" fill="#1e293b" />
    <circle cx="95" cy="190" r="18" fill="#94a3b8" />
    <circle cx="95" cy="190" r="8" fill="#475569" />

    <!-- Rear Wheel (Right) -->
    <circle cx="365" cy="190" r="32" fill="#0f172a" />
    <circle cx="365" cy="190" r="28" fill="#1e293b" />
    <circle cx="365" cy="190" r="18" fill="#94a3b8" />
    <circle cx="365" cy="190" r="8" fill="#475569" />

    <!-- Ground shadow underneath wheels -->
    <ellipse cx="230" cy="222" rx="210" ry="10" fill="#000000" opacity="0.35" />
  </g>
</svg>
