<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="auto">
  <rect width="320" height="220" fill="#f8fafc" rx="8" />
  <!-- Water body -->
  <path d="M 0,0 L 90,0 Q 110,60 85,110 Q 70,160 85,220 L 0,220 Z" fill="#93c5fd" opacity="0.65" />
  <!-- Lake Washington -->
  <path d="M 125,70 Q 145,110 135,160 Q 150,150 145,90 Z" fill="#93c5fd" opacity="0.6" />
  <!-- Roads -->
  <path d="M 105,0 L 115,70 L 108,130 L 95,220" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.8" />
  <path d="M 115,70 Q 170,110 165,170 Q 160,200 95,210" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.8" />
  <line x1="80" y1="40" x2="300" y2="40" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="80" y1="100" x2="300" y2="100" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="80" y1="160" x2="300" y2="160" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Red pins -->
  <circle cx="108" cy="130" r="4.5" fill="#dc2626" />
  <circle cx="108" cy="130" r="2" fill="#ffffff" />
  <circle cx="130" cy="80" r="4" fill="#dc2626" />
  <circle cx="130" cy="80" r="1.5" fill="#ffffff" />
  <circle cx="160" cy="120" r="4" fill="#dc2626" />
  <circle cx="160" cy="120" r="1.5" fill="#ffffff" />
  <circle cx="115" cy="40" r="4" fill="#dc2626" />
  <circle cx="115" cy="40" r="1.5" fill="#ffffff" />
  <circle cx="150" cy="50" r="3.5" fill="#dc2626" />
  <circle cx="150" cy="50" r="1.5" fill="#ffffff" />
  <circle cx="180" cy="140" r="3.5" fill="#dc2626" />
  <circle cx="180" cy="140" r="1.5" fill="#ffffff" />
  <circle cx="140" cy="180" r="3.5" fill="#dc2626" />
  <circle cx="140" cy="180" r="1.5" fill="#ffffff" />

  <!-- Seattle marker -->
  <text x="50" y="145" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#0f172a">SEATTLE</text>
  <text x="135" y="75" font-family="Arial, sans-serif" font-weight="800" font-size="8.5" fill="#0f172a">Mill Creek</text>
  <text x="170" y="115" font-family="Arial, sans-serif" font-weight="800" font-size="8.5" fill="#0f172a">Bellevue</text>
</svg>
