<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="100%" height="auto">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <path d="M 280,260 Q 320,290 310,240 Q 330,220 290,200 Z" fill="#dc2626" opacity="0.8" />
  <path d="M 30,280 Q 10,260 20,230 Q 5,200 40,220 Z" fill="#15803d" opacity="0.6" />

  <!-- Clipboard Board -->
  <rect x="60" y="40" width="200" height="260" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" filter="url(#card-shadow)" />
  <!-- Clipboard Metal Clamp on top -->
  <rect x="120" y="24" width="80" height="32" rx="6" fill="#94a3b8" stroke="#64748b" stroke-width="2" />
  <circle cx="160" cy="38" r="7" fill="#475569" />

  <!-- Paper on clipboard -->
  <rect x="75" y="65" width="170" height="220" rx="8" fill="#ffffff" stroke="#f1f5f9" />

  <!-- Checklist Rows -->
  <!-- Row 1 -->
  <rect x="95" y="95" width="22" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <path d="M 99,106 L 105,112 L 114,99" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="128" y="99" width="100" height="8" rx="3" fill="#334155" />
  <rect x="128" y="112" width="70" height="5" rx="2" fill="#94a3b8" />

  <!-- Row 2 -->
  <rect x="95" y="135" width="22" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <path d="M 99,146 L 105,152 L 114,139" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="128" y="139" width="95" height="8" rx="3" fill="#334155" />
  <rect x="128" y="152" width="60" height="5" rx="2" fill="#94a3b8" />

  <!-- Row 3 -->
  <rect x="95" y="175" width="22" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <path d="M 99,186 L 105,192 L 114,179" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="128" y="179" width="102" height="8" rx="3" fill="#334155" />
  <rect x="128" y="192" width="80" height="5" rx="2" fill="#94a3b8" />

  <!-- Row 4 -->
  <rect x="95" y="215" width="22" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <rect x="128" y="219" width="90" height="8" rx="3" fill="#64748b" />
  <rect x="128" y="232" width="50" height="5" rx="2" fill="#cbd5e1" />

  <!-- Woman Estimator silhouette on the right (matching screenshot) -->
  <g transform="translate(240, 110)">
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="14" fill="#f87171" />
    <path d="M 10,20 Q 20,4 32,15 Q 36,35 22,34 Z" fill="#0f172a" />
    <!-- Torso -->
    <path d="M 12,38 L 28,38 L 35,95 L 8,95 Z" fill="#dc2626" />
    <!-- Pants -->
    <rect x="10" y="95" width="10" height="75" fill="#1e293b" />
    <rect x="23" y="95" width="10" height="75" fill="#1e293b" />
    <!-- Arm holding pencil -->
    <path d="M 12,45 L -10,75 L -5,80 L 14,55 Z" fill="#f87171" />
    <!-- Red pen -->
    <line x1="-15" y1="70" x2="-5" y2="85" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
